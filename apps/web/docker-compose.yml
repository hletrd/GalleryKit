services:

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        BASE_URL: ${BASE_URL:-}
        IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
        UPLOAD_MAX_TOTAL_BYTES: ${UPLOAD_MAX_TOTAL_BYTES:-}
        NEXT_UPLOAD_BODY_MAX_BYTES: ${NEXT_UPLOAD_BODY_MAX_BYTES:-}
    container_name: gallerykit-web
    restart: always
    stop_grace_period: 30s
    # Use host networking so the container can reach MySQL on 127.0.0.1.
    # Nginx reverse proxy on the host handles rate limiting and security headers.
    network_mode: host
    env_file:
      - .env.local
    environment:
      HOSTNAME: 127.0.0.1
      TRUST_PROXY: "true"

    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/apps/web/public/uploads
      - ./public/resources:/app/apps/web/public/resources
      # NOTE (ARCH-03, run-10 c2): site-config.json is BUILD-TIME-INLINED (every
      # consumer `import`s it, and Next inlines JSON imports at build). This mount
      # only guarantees the build context file exists for rebuilds on this host —
      # editing the mounted file has NO runtime effect until the next image rebuild.
      - ./src/site-config.json:/app/apps/web/src/site-config.json:ro
