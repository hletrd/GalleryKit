# Rate limiting zones (per-IP, shared memory)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# Preserve the trusted edge's scheme when this nginx instance is the internal
# HTTP hop behind a TLS-terminating load balancer. Fall back to this listener's
# scheme when the upstream header is absent or not an explicit http/https value.
map $http_x_forwarded_proto $gallerykit_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

# Upstream with keepalive to avoid per-request TCP handshakes
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name gallery.atik.kr;

    # INTERNAL HTTP HOP ONLY: this file is intended to run behind a
    # TLS-terminating edge/load balancer that forwards HTTPS requests to this
    # local listener. HSTS below does not provide TLS by itself. Do not expose
    # this listener as the public cleartext edge; if nginx is the public edge,
    # add a separate 443 server block with certificates and redirect cleartext
    # 80 traffic before enabling HSTS in production.
    # Default to a small request body. Large admin upload/restore endpoints opt
    # into their own caps below, reducing pre-auth Server Action body exposure.
    client_max_body_size 2M;
    client_body_timeout 60s;
    send_timeout 30s;

    # Limit concurrent connections per IP
    limit_conn connlimit 20;

    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=(), attribution-reporting=(), private-state-token-redemption=(), private-state-token-issuance=(), idle-detection=()" always;
    # CSP for proxied responses is set by Next.js (single source of truth).
    # Only the static image location below has its own tighter CSP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;

    # Rate-limit POST to admin login page (both with and without locale prefix)
    location ~ ^(/[a-z]{2})?/admin$ {
        client_max_body_size 64K;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Keep restore bodies aligned with the app-level 250 MB cap instead of the
    # broader gallery upload allowance.
    location ~ ^(/[a-z]{2})?/admin/db {
        client_max_body_size 250M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Dashboard uploads allow the documented 200 MiB per-file cap plus form
    # overhead, while still staying far below the historical 2 GiB blanket cap.
    location ~ ^(/[a-z]{2})?/admin/dashboard {
        client_max_body_size 216M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Rate-limit admin mutation routes (category/tag/user/settings/seo/token changes)
    location ~ ^(/[a-z]{2})?/admin/(categories|tags|users|password|seo|settings|tokens) {
        client_max_body_size 2M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # PAT-authenticated external upload API (US-P53). This route accepts a
    # full-resolution multipart photo upload (rendered JPEG exports are
    # routinely 8-15 MiB; originals larger) and re-uses the same upload infra
    # as the browser dashboard, enforcing the app-level 200 MiB per-file cap.
    # It MUST get the larger 216 MiB body budget — the generic /api/admin/ 2M
    # cap below would 413 every real photo at the edge before the route runs,
    # silently breaking external publish clients (run-6 cycle-10 AGG-C10-01).
    # A longest-prefix ^~ match wins over the shorter ^~ /api/admin/ prefix, so
    # this block takes precedence regardless of source ordering.
    location ^~ /api/admin/lr/upload {
        client_max_body_size 216M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Admin API mutation routes bypass page-path regexes and need the same edge
    # throttle/body budget as form-backed admin mutations.
    location ^~ /api/admin/ {
        client_max_body_size 2M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    location ^~ /uploads/original/ {
        return 404;
    }

    # Proxy uploaded derivatives to Next by default. The documented deployment
    # runs nginx on the host while the app container bind-mounts public files at
    # a container-internal path; rooting this host-side nginx at /app/... would
    # 404 derivatives. Next serves existing public files and route-handler
    # fallbacks with the same cache/security policy.
    location ~ ^(?:/[a-z]{2})?/uploads/(jpeg|webp|avif)/.+\.(?:jpe?g|webp|avif)$ {
        # Keep the same cache policy declared by next.config.ts and serve-upload.ts.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";  # Enable keepalive (empty = no close)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
