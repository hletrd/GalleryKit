# Rate limiting zones (per-IP, shared memory)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/m;
# Public SSR page surface (C2-06 run-10 cycle-2 CRIT-01): every public page
# (home, topic, photo, map, timeline, year-in-review, smart collection) is
# rendered with revalidate=0 (always dynamic, multi-query per request) and had
# no edge-level rate limit at all before this zone. Deliberately expressed in
# r/s (not r/m like login/admin above) and sized generously — see the comment
# on the catch-all location below for what is and isn't covered by this zone.
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
# Next.js on-demand image optimizer (C3-09 run-10 cycle-3 CRIT3-02): each
# uncached (url,w,q) tuple runs a Sharp re-encode and writes a
# .next/cache/images entry on a disk-fragile host, so a blanket exemption
# from any limiter left the one CPU+disk-heavy public endpoint unthrottled.
# Its own MUCH looser zone (vs zone=public) keeps a legitimate cold-cache
# masonry paint's parallel tile fan-out clear of the budget while still
# capping a per-IP enumeration flood; limit_conn (server-scope) backstops
# concurrency as before.
limit_req_zone $binary_remote_addr zone=nextimage:10m rate=30r/s;
# LIMITER KEY CAVEAT (C3-12 run-10 cycle-3 TRC3-05): $binary_remote_addr in
# ALL limit_req_zone lines above is nginx's TCP-peer address. The XFF
# TOPOLOGY CONTRACT remediation documented on the server block below
# (switching proxy_set_header X-Forwarded-For to $proxy_add_x_forwarded_for)
# fixes only what the APP sees — it does NOT change $binary_remote_addr. In
# an LB-fronted topology these zones ALSO need ngx_http_realip_module
# configuration (set_real_ip_from <LB source>; real_ip_header
# X-Forwarded-For;) or PROXY-protocol support, otherwise every visitor
# shares the LB's single per-IP bucket and legitimate traffic 429s.
limit_conn_zone $binary_remote_addr zone=connlimit:10m;

# Preserve the trusted edge's scheme when this nginx instance is the internal
# HTTP hop behind a TLS-terminating load balancer. Fall back to this listener's
# scheme when the upstream header is absent or not an explicit http/https value.
map $http_x_forwarded_proto $gallerykit_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

# Upstream with keepalive to avoid per-request TCP handshakes
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name gallery.atik.kr;

    # INTERNAL HTTP HOP ONLY: this file is intended to run behind a
    # TLS-terminating edge/load balancer that forwards HTTPS requests to this
    # local listener. HSTS below does not provide TLS by itself. Do not expose
    # this listener as the public cleartext edge; if nginx is the public edge,
    # add a separate 443 server block with certificates and redirect cleartext
    # 80 traffic before enabling HSTS in production.
    #
    # X-Forwarded-For TOPOLOGY CONTRACT (run-10 cycle-1 C1-11 / SEC-01): every
    # location below OVERWRITES XFF with $remote_addr. That is CORRECT ONLY
    # when the entity connecting to this listener IS the real client — i.e.
    # when the TLS terminator in front of nginx preserves client source IPs
    # (same-host stunnel/edge, PROXY-protocol-aware LB, or nginx itself as the
    # public edge). It matches the app default TRUSTED_PROXY_HOPS=1 (see
    # CLAUDE.md). If instead an upstream LB terminates TLS and connects from
    # its OWN IP, $remote_addr is the LB — the overwrite discards the real
    # client IP and EVERY per-IP rate limit in the app collapses into one
    # shared bucket (any five failed logins lock out all users). In that
    # topology you MUST switch the client-facing locations' X-Forwarded-For
    # value from $remote_addr to the append form ($proxy_add_x_forwarded_for)
    # and set TRUSTED_PROXY_HOPS to the real hop count instead.
    # Default to a small request body. Large admin upload/restore endpoints opt
    # into their own caps below, reducing pre-auth Server Action body exposure.
    client_max_body_size 2M;
    client_body_timeout 60s;
    send_timeout 30s;

    # Limit concurrent connections per IP
    limit_conn connlimit 20;

    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=(), attribution-reporting=(), private-state-token-redemption=(), private-state-token-issuance=(), idle-detection=()" always;
    # CSP for proxied responses is set by Next.js (single source of truth).
    # Only the static image location below has its own tighter CSP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    proxy_hide_header X-Powered-By;

    # Rate-limit POST to admin login page (both with and without locale prefix)
    location ~ ^(/[a-z]{2})?/admin$ {
        client_max_body_size 64K;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Keep restore bodies aligned with the app-level 250 MB cap instead of the
    # broader gallery upload allowance.
    location ~ ^(/[a-z]{2})?/admin/db {
        client_max_body_size 250M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Dashboard uploads allow the documented 200 MiB per-file cap plus form
    # overhead, while still staying far below the historical 2 GiB blanket cap.
    location ~ ^(/[a-z]{2})?/admin/dashboard {
        client_max_body_size 216M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Rate-limit admin mutation routes (category/tag/user/settings/seo/token changes)
    location ~ ^(/[a-z]{2})?/admin/(categories|tags|users|password|seo|settings|tokens) {
        client_max_body_size 2M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # PAT-authenticated external upload API (US-P53). This route accepts a
    # full-resolution multipart photo upload (rendered JPEG exports are
    # routinely 8-15 MiB; originals larger) and re-uses the same upload infra
    # as the browser dashboard, enforcing the app-level 200 MiB per-file cap.
    # It MUST get the larger 216 MiB body budget — the generic /api/admin/ 2M
    # cap below would 413 every real photo at the edge before the route runs,
    # silently breaking external publish clients (run-6 cycle-10 AGG-C10-01).
    # A longest-prefix ^~ match wins over the shorter ^~ /api/admin/ prefix, so
    # this block takes precedence regardless of source ordering.
    location ^~ /api/admin/lr/upload {
        client_max_body_size 216M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Admin API mutation routes bypass page-path regexes and need the same edge
    # throttle/body budget as form-backed admin mutations.
    location ^~ /api/admin/ {
        client_max_body_size 2M;
        limit_req zone=admin burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    location ^~ /uploads/original/ {
        return 404;
    }

    # Proxy uploaded derivatives to Next by default. The documented deployment
    # runs nginx on the host while the app container bind-mounts public files at
    # a container-internal path; rooting this host-side nginx at /app/... would
    # 404 derivatives. Next serves existing public files and route-handler
    # fallbacks with the same cache/security policy.
    location ~ ^(?:/[a-z]{2})?/uploads/(jpeg|webp|avif)/.+\.(?:jpe?g|webp|avif)$ {
        # Keep the same cache policy declared by next.config.ts and serve-upload.ts.
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Next.js content-hashed static build assets (JS/CSS chunks under
    # /_next/static/) are immutable and can be fetched dozens of times on a
    # single cold-cache page load. The i18n middleware matcher already
    # excludes `_next` from locale routing (see proxy.ts), so this path is
    # never locale-prefixed. Matched here as a `^~` prefix so it takes
    # precedence over the catch-all location below and never reaches the
    # public rate limit applied there.
    location ^~ /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    # Next.js on-demand image optimization endpoint (used by next/image,
    # confirmed in use by OptimisticImage/photo-viewer/etc. without
    # `unoptimized`). A single masonry gallery page can request dozens of
    # resized derivatives through this ONE path in parallel, so — like
    # /_next/static above and /uploads/(jpeg|webp|avif)/ below — it must stay
    # outside the public page limiter, or a normal cold-cache page load could
    # exhaust a per-IP burst by itself. Also excluded from locale routing by
    # the middleware matcher, so no locale-prefixed variant exists.
    location ^~ /_next/image {
        # C3-09 (run-10 c3): dedicated generous limiter instead of a blanket
        # exemption — 30 r/s + burst 120 clears a legit cold-cache masonry
        # paint (30+ tiles) with headroom while capping a per-IP
        # (url x width x quality) enumeration flood on the one public
        # endpoint that burns Sharp CPU + disk-cache writes per uncached
        # tuple. Kept OFF zone=public so page navigation budgets and image
        # fan-out budgets cannot starve each other.
        limit_req zone=nextimage burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;
    }

    location / {
        # Generous per-IP flood cap for the public SSR page surface (C2-06
        # run-10 cycle-2 CRIT-01). This is the ONLY location this zone is
        # applied to. Everything that could turn a single normal page view
        # into a burst of requests already has its own location and is NOT
        # subject to this limiter: /_next/static/ and /_next/image above,
        # /uploads/(jpeg|webp|avif)/ and /uploads/original/ below, and every
        # /admin* / /api/admin/* location earlier in this file (those carry
        # their own `admin`/`login` zones). What DOES land here is the actual
        # page navigation itself plus same-URL RSC/prefetch fetches Next
        # issues for that page — a real visitor's normal browsing should
        # never come close to tripping burst=40 at rate=10r/s. This is a
        # blunt edge-level backstop, not a replacement for the app-layer
        # limiters (login, search, load-more, share/OG fast paths — see
        # CLAUDE.md) that already guard specific expensive routes/actions.
        #
        # Config-only change: this file is not touched by deploys. An
        # operator must apply it manually and reload, e.g.:
        #   nginx -t && systemctl reload nginx
        # (or the equivalent for however this nginx instance is managed).
        limit_req zone=public burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";  # Enable keepalive (empty = no close)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $gallerykit_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
